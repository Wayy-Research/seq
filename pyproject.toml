[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seq-analyzer"
version = "0.1.0"
description = "Sequence analyzer that fills in missing numbers using rule-based detection, OEIS lookup, and deep learning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "rcgalbo" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "sympy>=1.12",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
seq = "seq.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["seq"]
